<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chiquiprueba - Progreso Local</title>
</head>
<body>
    <h2>Plataforma de Estudios (Prueba LocalStorage)</h2>

    <div style="margin-bottom: 20px; padding: 10px; border: 1px solid black;">
        <h3>Matemáticas Básicas</h3>
        <p>Progreso actual: <strong id="progreso-mate">0</strong><strong>%</strong></p>
        <button onclick="avanzarLeccion('mate')">Completar lección (+20%)</button>
    </div>

    <div style="margin-bottom: 20px; padding: 10px; border: 1px solid black;">
        <h3>Inglés Básico</h3>
        <p>Progreso actual: <strong id="progreso-ingles">0</strong><strong>%</strong></p>
        <button onclick="avanzarLeccion('ingles')">Completar lección (+20%)</button>
    </div>

    <hr>
    <button onclick="borrarProgreso()">Borrar Todo (Simular usuario nuevo / otra PC)</button>

    <script>
        // 1. LEER EL STORAGE AL INICIAR
        // Si no hay nada guardado, iniciamos los cursos en 0.
        let progreso = JSON.parse(localStorage.getItem('progresoEstudios')) || {
            mate: 0,
            ingles: 0
        };

        // Función para reflejar los datos en el HTML
        function actualizarPantalla() {
            document.getElementById('progreso-mate').innerText = progreso.mate;
            document.getElementById('progreso-ingles').innerText = progreso.ingles;
        }

        // 2. MODIFICAR Y GUARDAR EN EL STORAGE
        function avanzarLeccion(curso) {
            // Aumentamos el progreso solo si es menor a 100
            if (progreso[curso] < 100) {
                progreso[curso] += 20; 
                
                // Sobrescribimos la "bóveda" con el nuevo progreso
                localStorage.setItem('progresoEstudios', JSON.stringify(progreso));
                
                // Actualizamos la vista
                actualizarPantalla();
            }
        }

        // 3. LIMPIAR EL STORAGE
        function borrarProgreso() {
            localStorage.removeItem('progresoEstudios');
            progreso = { mate: 0, ingles: 0 }; // Reiniciamos variables
            actualizarPantalla();
        }

        // Ejecutar al cargar la página por primera vez
        actualizarPantalla();
    </script>
</body>
</html>
