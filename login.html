<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ubuntu Perú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ubuntu-green: #2D7A4F;
            --ubuntu-maroon: #6B2D3E;
            --siemens-teal: #009999;
            --siemens-slate: #1E2225;
            --bg-body: #F4F5F7;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #5a6b7c;
            --border-color: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--siemens-slate) 0%, var(--ubuntu-green) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .login-container {
            background: var(--bg-card);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 22px;
        }
        .auth-tab {
            flex: 1;
            padding: 11px 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            outline: none;
        }
        .auth-tab.active {
            color: var(--siemens-teal);
        }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2.5px;
            background: var(--siemens-teal);
            border-radius: 2px;
        }
        .auth-tab:hover:not(.active) {
            color: var(--text-primary);
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            color: var(--text-primary);
            background-color: #fafafa;
        }
        .form-group input:focus {
            border-color: var(--siemens-teal);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 153, 153, 0.12);
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .password-wrapper input {
            padding-right: 42px;
        }
        .toggle-password-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: color 0.2s ease;
            outline: none;
        }
        .toggle-password-btn:hover {
            color: var(--siemens-teal);
        }
        .student-role-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 153, 153, 0.08);
            border: 1px solid rgba(0, 153, 153, 0.2);
            color: var(--siemens-teal);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--siemens-teal), #00b3b3);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 4px;
        }
        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 4px 14px rgba(0, 153, 153, 0.35);
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .auth-switch {
            margin-top: 18px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-switch a {
            color: var(--siemens-teal);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #f87171;
            display: block;
        }
        .message.success {
            background: #dcfce3;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }

        /* Barra de acceso a la Guía de Estudiante */
        .auth-guide-banner {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-guide-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(0, 153, 153, 0.06);
            border: 1px solid rgba(0, 153, 153, 0.25);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-guide-trigger:hover {
            background: rgba(0, 153, 153, 0.12);
            border-color: var(--siemens-teal);
            transform: translateY(-1px);
        }
        .btn-guide-trigger i.guide-icon {
            font-size: 1.35rem;
            color: var(--siemens-teal);
            flex-shrink: 0;
        }
        .guide-trigger-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .guide-trigger-title {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .guide-trigger-sub {
            font-size: 0.75rem;
            color: var(--siemens-teal);
            font-weight: 600;
        }
        .guide-trigger-arrow {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
        }
        .btn-guide-trigger:hover .guide-trigger-arrow {
            transform: translateX(3px);
            color: var(--siemens-teal);
        }

        /* Modal Guía Estudiante en Login */
        .guide-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .guide-modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .guide-modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 1050px;
            height: 90vh;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            transform: scale(0.96);
            transition: transform 0.2s ease;
        }
        .guide-modal-overlay.active .guide-modal-box {
            transform: scale(1);
        }
        .guide-modal-header {
            background: linear-gradient(135deg, var(--siemens-slate) 0%, #0d3838 100%);
            color: #ffffff;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .guide-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .guide-header-title i {
            font-size: 1.4rem;
            color: var(--siemens-teal);
            background: rgba(0, 153, 153, 0.2);
            padding: 8px;
            border-radius: 8px;
        }
        .guide-header-title h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
        }
        .guide-header-title p {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            margin: 2px 0 0 0;
        }
        .guide-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .guide-btn-ext {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 7px 12px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        .guide-btn-ext:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .guide-btn-close {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s ease;
        }
        .guide-btn-close:hover {
            color: #ffffff;
        }
        .guide-modal-body {
            position: relative;
            flex: 1;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Pestañas (PDF / Video) en Login */
        .guide-tabs-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b1120;
            padding: 9px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .guide-tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .guide-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }
        .guide-tab-btn.active {
            background: rgba(0, 153, 153, 0.2);
            border-color: var(--siemens-teal);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 153, 153, 0.25);
        }
        .guide-tab-tag {
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .guide-tab-btn.active .guide-tab-tag.tag-pdf {
            background: rgba(0, 153, 153, 0.35);
            color: #5eead4;
        }
        .guide-tab-btn.active .guide-tab-tag.tag-video {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }
        .guide-tab-pane {
            display: none;
            width: 100%;
            height: 100%;
            flex: 1;
            position: relative;
        }
        .guide-tab-pane.active {
            display: flex;
            flex-direction: column;
        }
        .guide-iframe,
        .guide-tab-pane .guide-iframe {
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            background: #0f172a;
        }
        @media (max-width: 640px) {
            .guide-modal-box {
                height: 96vh;
                border-radius: var(--radius-md);
            }
            .guide-header-title p, .guide-btn-ext span {
                display: none;
            }
            .guide-modal-header {
                padding: 12px 14px;
            }
            .guide-tabs-bar {
                padding: 8px 12px;
                gap: 6px;
            }
            .guide-tab-btn {
                flex: 1;
                justify-content: center;
                padding: 6px 10px;
                font-size: 0.76rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.jpg" alt="Logo Ubuntu Perú" class="logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'48\' viewBox=\'0 0 150 48\'><rect width=\'150\' height=\'48\' rx=\'10\' fill=\'%23009999\'/><text x=\'50%25\' y=\'55%25\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-family=\'sans-serif\' font-weight=\'bold\' font-size=\'20\'>Ubuntu Perú</text></svg>';">

        <!-- Pestañas -->
        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Iniciar Sesión</button>
            <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Registrarse</button>
        </div>

        <!-- Formulario 1: Iniciar Sesión -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Correo Electrónico</label>
                <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="loginPassword">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Tu contraseña" required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" data-target="loginPassword" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="btnLoginSubmit">Ingresar</button>
            <p class="auth-switch">
                ¿No tienes una cuenta? <a href="#" id="linkToRegister">Regístrate como estudiante</a>
            </p>
        </form>

        <!-- Formulario 2: Registro Estudiante -->
        <form id="registerForm" style="display: none;">
            <div class="student-role-notice">
                <i class="fa-solid fa-graduation-cap"></i> Registro exclusivo para Alumnos / Estudiantes
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="regNombre">Nombre</label>
                    <input type="text" id="regNombre" placeholder="Tu nombre" required autocomplete="given-name">
                </div>
                <div class="form-group">
                    <label for="regApellidos">Apellidos</label>
                    <input type="text" id="regApellidos" placeholder="Tus apellidos" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 0 0 100px;">
                    <label for="regEdad">Edad</label>
                    <input type="number" id="regEdad" placeholder="Ej. 20" min="5" max="105" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="estudiante@correo.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="regPassword">Contraseña (Mínimo 6 caracteres)</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Crea una contraseña segura" minlength="6" required autocomplete="new-password">
                    <button type="button" class="toggle-password-btn" data-target="regPassword" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">Confirmar Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" minlength="6" required autocomplete="new-password">
                    <button type="button" class="toggle-password-btn" data-target="regConfirmPassword" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnRegisterSubmit">Crear cuenta de estudiante</button>
            <p class="auth-switch">
                ¿Ya tienes una cuenta? <a href="#" id="linkToLogin">Iniciar sesión</a>
            </p>
        </form>

        <div id="message" class="message"></div>

        <!-- Acceso directo a la Guía de Estudiante para nuevos alumnos -->
        <div class="auth-guide-banner">
            <button type="button" class="btn-guide-trigger" id="btnOpenGuideLogin">
                <i class="fa-solid fa-book-open-reader guide-icon"></i>
                <div class="guide-trigger-text">
                    <span class="guide-trigger-title">¿Primera vez o dudas para ingresar?</span>
                    <span class="guide-trigger-sub">Consulta la Guía del Estudiante (PDF y Video)</span>
                </div>
                <i class="fa-solid fa-chevron-right guide-trigger-arrow"></i>
            </button>
        </div>
    </div>

    <!-- Modal Guía de Usuario Estudiante (Pre-Login) -->
    <div id="modalGuideLogin" class="guide-modal-overlay">
        <div class="guide-modal-box">
            <div class="guide-modal-header">
                <div class="guide-header-title">
                    <i class="fa-solid fa-book-open-reader"></i>
                    <div>
                        <h3>Guía de Usuario para Estudiantes</h3>
                        <p>Aprende a registrarte, iniciar sesión y navegar en la plataforma</p>
                    </div>
                </div>
                <div class="guide-header-actions">
                    <a id="guideLoginExtLink" href="https://drive.google.com/file/d/16DUmP7ECAkjJCUxBrOJtQord8KTRapaN/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="guide-btn-ext" title="Abrir en pestaña nueva">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> <span id="guideLoginExtText">Abrir en Drive</span>
                    </a>
                    <button type="button" class="guide-btn-close" id="btnCloseGuideLogin" title="Cerrar Guía">&times;</button>
                </div>
            </div>

            <!-- Pestañas PDF y Video -->
            <div class="guide-tabs-bar">
                <button type="button" class="guide-tab-btn guide-tab-btn-login active" data-tab="pdf" onclick="switchLoginGuideTab('pdf')">
                    <i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i>
                    <span>Guía en PDF</span>
                    <span class="guide-tab-tag tag-pdf">Drive</span>
                </button>
                <button type="button" class="guide-tab-btn guide-tab-btn-login" data-tab="video" onclick="switchLoginGuideTab('video')">
                    <i class="fa-brands fa-youtube" style="color: #ef4444; font-size: 1rem;"></i>
                    <span>Video Tutorial</span>
                    <span class="guide-tab-tag tag-video">HD</span>
                </button>
            </div>

            <div class="guide-modal-body">
                <div id="guideLoginPanePdf" class="guide-tab-pane active">
                    <iframe id="guideLoginIframe" class="guide-iframe" src="" allow="autoplay" allowfullscreen></iframe>
                </div>
                <div id="guideLoginPaneVideo" class="guide-tab-pane">
                    <iframe id="guideLoginVideoIframe" class="guide-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAplMdumdxbNTm9ySnkgKINGLoUDtkuXY8",
            authDomain: "ubuntu-cursos.firebaseapp.com",
            projectId: "ubuntu-cursos",
            storageBucket: "ubuntu-cursos.firebasestorage.app",
            messagingSenderId: "427990859227",
            appId: "1:427990859227:web:12fa3ccb9fe081fe41bbfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegistering = false;

        // Si ya tiene sesión activa, redirigir automáticamente al dashboard (a menos que esté registrándose)
        onAuthStateChanged(auth, (user) => {
            if (user && !isRegistering) {
                window.location.href = 'index.html';
            }
        });

        // Elementos DOM
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const linkToRegister = document.getElementById('linkToRegister');
        const linkToLogin = document.getElementById('linkToLogin');
        const messageEl = document.getElementById('message');
        const btnLoginSubmit = document.getElementById('btnLoginSubmit');
        const btnRegisterSubmit = document.getElementById('btnRegisterSubmit');

        // Helpers de Mensajes
        function showMsg(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        function clearMsg() {
            messageEl.textContent = '';
            messageEl.style.display = 'none';
        }

        // Alternancia de Pestañas
        function switchView(view) {
            clearMsg();
            if (view === 'login') {
                tabLogin.classList.add('active');
                tabLogin.setAttribute('aria-selected', 'true');
                tabRegister.classList.remove('active');
                tabRegister.setAttribute('aria-selected', 'false');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                tabRegister.classList.add('active');
                tabRegister.setAttribute('aria-selected', 'true');
                tabLogin.classList.remove('active');
                tabLogin.setAttribute('aria-selected', 'false');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        tabLogin.addEventListener('click', () => switchView('login'));
        tabRegister.addEventListener('click', () => switchView('register'));
        linkToRegister.addEventListener('click', (e) => { e.preventDefault(); switchView('register'); });
        linkToLogin.addEventListener('click', (e) => { e.preventDefault(); switchView('login'); });

        // Toggles para mostrar/ocultar contraseñas
        document.querySelectorAll('.toggle-password-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                const icon = btn.querySelector('i');
                if (targetInput && icon) {
                    const isPass = targetInput.type === 'password';
                    targetInput.type = isPass ? 'text' : 'password';
                    icon.className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                }
            });
        });

        // 1. INICIAR SESIÓN
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            btnLoginSubmit.disabled = true;
            btnLoginSubmit.textContent = 'Iniciando sesión...';
            clearMsg();

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMsg('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            } catch (error) {
                console.error("Error de autenticación:", error);
                btnLoginSubmit.disabled = false;
                btnLoginSubmit.textContent = 'Ingresar';
                
                let errorMsg = 'Error al iniciar sesión. Verifica tus credenciales.';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg = 'Correo o contraseña incorrectos.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'El formato del correo electrónico no es válido.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'Demasiados intentos. Por favor espera unos momentos.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Error de conexión. Revisa tu acceso a internet.';
                }
                
                showMsg(errorMsg, 'error');
            }
        });

        // 2. REGISTRO DE ESTUDIANTE
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const nombre = document.getElementById('regNombre').value.trim();
            const apellidos = document.getElementById('regApellidos').value.trim();
            const edadVal = document.getElementById('regEdad').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            const edad = parseInt(edadVal, 10);

            // Validaciones locales
            if (!nombre || !apellidos) {
                showMsg('Por favor ingresa tu nombre y tus apellidos completos.', 'error');
                return;
            }
            if (isNaN(edad) || edad < 5 || edad > 115) {
                showMsg('Por favor ingresa una edad válida (entre 5 y 115 años).', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMsg('Las contraseñas no coinciden. Por favor verifícalas.', 'error');
                return;
            }

            isRegistering = true;
            btnRegisterSubmit.disabled = true;
            btnRegisterSubmit.textContent = 'Creando cuenta...';
            clearMsg();

            try {
                // Paso 1: Crear usuario en Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const nombreCompleto = `${nombre} ${apellidos}`;

                // Paso 2: Actualizar perfil base (displayName)
                try {
                    await updateProfile(user, { displayName: nombreCompleto });
                } catch (profErr) {
                    console.warn("Aviso al guardar displayName:", profErr);
                }

                // Paso 3: Guardar en Firestore colección 'usuarios'
                // NOTA IMPORTANTE: El rol es estrictamente 'estudiante'
                await setDoc(doc(db, 'usuarios', user.uid), {
                    uid: user.uid,
                    nombre: nombre,
                    apellidos: apellidos,
                    nombreCompleto: nombreCompleto,
                    edad: edad,
                    email: email,
                    rol: 'estudiante',
                    fechaRegistro: new Date().toISOString()
                });

                showMsg('¡Cuenta de estudiante creada con éxito! Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } catch (error) {
                isRegistering = false;
                console.error("Error al registrar estudiante:", error);
                btnRegisterSubmit.disabled = false;
                btnRegisterSubmit.textContent = 'Crear cuenta de estudiante';

                let errorMsg = 'Error al registrar tu cuenta. Inténtalo nuevamente.';
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'Este correo ya se encuentra registrado. Inicia sesión en la pestaña superior.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'El formato del correo electrónico ingresado no es válido.';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'La contraseña debe tener un mínimo de 6 caracteres.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Error de red o conexión. Revisa tu acceso a internet.';
                }

                showMsg(errorMsg, 'error');
            }
        });

        // Control de Modal Guía de Estudiante en Login
        const btnOpenGuideLogin = document.getElementById('btnOpenGuideLogin');
        const btnCloseGuideLogin = document.getElementById('btnCloseGuideLogin');
        const modalGuideLogin = document.getElementById('modalGuideLogin');
        const guideLoginIframe = document.getElementById('guideLoginIframe');
        const GUIDE_DRIVE_PREVIEW_URL = 'https://drive.google.com/file/d/16DUmP7ECAkjJCUxBrOJtQord8KTRapaN/preview';
        const GUIDE_DRIVE_EXT_URL = 'https://drive.google.com/file/d/16DUmP7ECAkjJCUxBrOJtQord8KTRapaN/view?usp=sharing';
        const GUIDE_VIDEO_EMBED_URL = 'https://www.youtube.com/embed/1YTXHXlbPQ0?enablejsapi=1&rel=0';
        const GUIDE_VIDEO_EXT_URL = 'https://youtu.be/1YTXHXlbPQ0';

        let currentLoginGuideTab = 'pdf';

        function switchLoginGuideTab(tab) {
            currentLoginGuideTab = tab;
            const tabBtns = document.querySelectorAll('.guide-tab-btn-login');
            const panePdf = document.getElementById('guideLoginPanePdf');
            const paneVideo = document.getElementById('guideLoginPaneVideo');
            const iframePdf = document.getElementById('guideLoginIframe');
            const iframeVideo = document.getElementById('guideLoginVideoIframe');
            const extLink = document.getElementById('guideLoginExtLink');

            tabBtns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tab) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (tab === 'pdf') {
                if (panePdf) panePdf.classList.add('active');
                if (paneVideo) paneVideo.classList.remove('active');
                if (iframePdf && (!iframePdf.src || iframePdf.src === 'about:blank' || !iframePdf.src.includes('drive.google.com'))) {
                    iframePdf.src = GUIDE_DRIVE_PREVIEW_URL;
                }
                // Pausar video si estaba reproduciéndose
                if (iframeVideo && iframeVideo.contentWindow) {
                    try {
                        iframeVideo.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                    } catch (e) {}
                }
                if (extLink) {
                    extLink.href = GUIDE_DRIVE_EXT_URL;
                    extLink.title = 'Abrir PDF en pestaña nueva';
                    extLink.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> <span id="guideLoginExtText">Abrir en Drive</span>';
                }
            } else if (tab === 'video') {
                if (paneVideo) paneVideo.classList.add('active');
                if (panePdf) panePdf.classList.remove('active');
                if (iframeVideo && (!iframeVideo.src || iframeVideo.src === 'about:blank' || !iframeVideo.src.includes('youtube.com'))) {
                    iframeVideo.src = GUIDE_VIDEO_EMBED_URL;
                }
                if (extLink) {
                    extLink.href = GUIDE_VIDEO_EXT_URL;
                    extLink.title = 'Ver en YouTube en pestaña nueva';
                    extLink.innerHTML = '<i class="fa-brands fa-youtube" style="color: #ef4444;"></i> <span id="guideLoginExtText">Ver en YouTube</span>';
                }
            }
        }
        window.switchLoginGuideTab = switchLoginGuideTab;

        function openLoginGuide(initialTab = 'pdf') {
            switchLoginGuideTab(initialTab);
            if (modalGuideLogin) modalGuideLogin.classList.add('active');
        }
        window.openLoginGuide = openLoginGuide;

        function closeLoginGuide() {
            if (modalGuideLogin) modalGuideLogin.classList.remove('active');
            // Detener reproducción de video de YouTube al cerrar modal
            const iframeVideo = document.getElementById('guideLoginVideoIframe');
            if (iframeVideo && iframeVideo.src) {
                iframeVideo.src = '';
            }
        }
        window.closeLoginGuide = closeLoginGuide;

        if (btnOpenGuideLogin) btnOpenGuideLogin.addEventListener('click', () => openLoginGuide('pdf'));
        if (btnCloseGuideLogin) btnCloseGuideLogin.addEventListener('click', closeLoginGuide);
        if (modalGuideLogin) {
            modalGuideLogin.addEventListener('click', (e) => {
                if (e.target === modalGuideLogin) closeLoginGuide();
            });
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalGuideLogin && modalGuideLogin.classList.contains('active')) {
                closeLoginGuide();
            }
        });
    </script>
</body>
</html>
