<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ubuntu Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ubuntu-green: #2D7A4F;
            --ubuntu-maroon: #6B2D3E;
            --siemens-teal: #009999;
            --siemens-slate: #1E2225;
            --bg-body: #F4F5F7;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #5a6b7c;
            --border-color: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-md: 0 6px 16px rgba(30,34,37,0.08);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--siemens-slate) 0%, var(--ubuntu-green) 100%);
        }
        .login-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            max-width: 150px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--siemens-teal);
            box-shadow: 0 0 0 3px rgba(0,153,153,0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--siemens-teal), #00b3b3);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-submit:hover {
            box-shadow: 0 4px 12px rgba(0,153,153,0.3);
            transform: translateY(-2px);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #f87171;
            display: block;
        }
        .message.success {
            background: #dcfce3;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.png" alt="Logo" class="logo">
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="text" id="email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAplMdumdxbNTm9ySnkgKINGLoUDtkuXY8",
            authDomain: "ubuntu-cursos.firebaseapp.com",
            projectId: "ubuntu-cursos",
            storageBucket: "ubuntu-cursos.firebasestorage.app",
            messagingSenderId: "427990859227",
            appId: "1:427990859227:web:12fa3ccb9fe081fe41bbfe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Si ya tiene sesión activa, redirigir automáticamente
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        const form = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.querySelector('.btn-submit');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Iniciando sesión...';
            messageEl.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                messageEl.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                messageEl.className = 'message success';
                messageEl.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 700);
            } catch (error) {
                console.error("Error de autenticación:", error);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ingresar';
                
                let errorMsg = 'Error al iniciar sesión. Verifica tus credenciales.';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg = 'Correo o contraseña incorrectos.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'El formato del correo electrónico no es válido.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'Demasiados intentos. Por favor espera unos momentos.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Error de conexión. Revisa tu acceso a internet.';
                }
                
                messageEl.textContent = errorMsg;
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
