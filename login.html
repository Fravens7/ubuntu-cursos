<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ubuntu Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ubuntu-green: #2D7A4F;
            --ubuntu-maroon: #6B2D3E;
            --siemens-teal: #009999;
            --siemens-slate: #1E2225;
            --bg-body: #F4F5F7;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #5a6b7c;
            --border-color: #e2e8f0;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-md: 0 6px 16px rgba(30,34,37,0.08);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--siemens-slate) 0%, var(--ubuntu-green) 100%);
        }
        .login-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            max-width: 150px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--siemens-teal);
            box-shadow: 0 0 0 3px rgba(0,153,153,0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--siemens-teal), #00b3b3);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-submit:hover {
            box-shadow: 0 4px 12px rgba(0,153,153,0.3);
            transform: translateY(-2px);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #f87171;
            display: block;
        }
        .message.success {
            background: #dcfce3;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.png" alt="Logo" class="logo">
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="text" id="email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            
            if (email === 'test@' && password === '123') {
                messageEl.textContent = '¡Éxito! Ingresando a la plataforma...';
                messageEl.className = 'message success';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                messageEl.textContent = 'datos incorrectos';
                messageEl.className = 'message error';
            }
        });
    </script>
</body>
</html>
